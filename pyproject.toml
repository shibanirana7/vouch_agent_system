[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vouch"
version = "0.1.0"
description = "Trust-first agentic shopping platform"
requires-python = ">=3.12"
dependencies = [
    # API
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",

    # Agent orchestration
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-google-genai>=2.0.0",
    "langchain-google-vertexai>=2.0.0",

    # MCP
    "fastmcp>=0.4.0",

    # Database
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.0",

    # Vector store (pgvector via raw psycopg2 — no Python pgvector package needed)

    # Auth
    "bcrypt>=4.0.0",

    # Schemas / config
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[tool.hatch.build.targets.wheel]
packages = ["backend/vouch"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
